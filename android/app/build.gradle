plugins { id 'com.android.application' }
android {
 namespace 'online.wydmeal.reservation'
 compileSdk 36
 defaultConfig { applicationId 'online.wydmeal.reservation'; minSdk 26; targetSdk 36; versionCode 6; versionName '2.3.1'; manifestPlaceholders = [AMAP_ANDROID_KEY: System.getenv('AMAP_ANDROID_KEY') ?: '', JPUSH_APPKEY: System.getenv('JPUSH_APP_KEY') ?: '', JPUSH_CHANNEL: 'official'] }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 buildTypes { release { minifyEnabled false } }
}

dependencies { implementation files('libs/amap-sdk.jar'); implementation 'cn.jiguang.sdk:jpush:6.3.0'; implementation 'cn.jiguang.sdk:jcore:5.6.0' }
